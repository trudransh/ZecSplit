[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2025-0141", reason = "bincode via ecdsa_fun adaptor; ADR-035" },
    { id = "RUSTSEC-2026-0374", reason = "basic-toml, build-time only, via age i18n proc-macros; ADR-037" },
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 via k256 0.13, pinned for dleq PrimeFieldBits; no 0.5 patch; ADR-047" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "CC0-1.0",
    "Unicode-3.0",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"
private = { ignore = true }

[[licenses.exceptions]]
crate = "hex_lit"
allow = ["MITNFA"]

[[licenses.exceptions]]
crate = "foldhash"
allow = ["Zlib"]

[[licenses.exceptions]]
crate = "nanorand"
allow = ["Zlib"]

[[licenses.exceptions]]
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
