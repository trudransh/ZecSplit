[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

# AGENTS.md NEVER-6 allowlist.
[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "CC0-1.0",
    "Unicode-3.0",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
