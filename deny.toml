[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# ADR-021: unmaintained notice, not a vulnerability. ecdsa_fun's adaptor feature pins bincode 2.
ignore = [{ id = "RUSTSEC-2025-0141", reason = "bincode via ecdsa_fun adaptor; ADR-021" }]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "CC0-1.0",
    "Unicode-3.0",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"
private = { ignore = true }

[[licenses.exceptions]]
crate = "hex_lit"
allow = ["MITNFA"]

[[licenses.exceptions]]
crate = "foldhash"
allow = ["Zlib"]

[[licenses.exceptions]]
crate = "nanorand"
allow = ["Zlib"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
