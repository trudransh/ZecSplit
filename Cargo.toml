[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor/dleq", "vendor/pasta_curves"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.93"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
bitcoin = "=0.32.11"
ecdsa_fun = { version = "=0.12.0", features = ["adaptor", "libsecp_compat_0_29"] }
rand_chacha = "=0.3.1"
async-trait = "=0.1.92"
blake2b_simd = "=1.0.5"
getrandom = { version = "=0.4.3", features = ["sys_rng"] }
hex = { version = "=0.4.3", features = ["serde"] }
proptest = "=1.12.0"
secp256k1 = "=0.29.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
tempfile = "=3.27.0"
tokio = { version = "=1.54.0", features = ["macros", "rt-multi-thread"] }
ts-rs = "=12.0.1"
zeroize = { version = "=1.9.1", features = ["derive"] }

dleq = { path = "vendor/dleq", features = ["experimental", "serialize"] }
flexible-transcript = { version = "=0.3.4", features = ["recommended"] }
k256 = { version = "=0.13.4", default-features = false, features = ["arithmetic", "bits", "hash2curve"] }
pasta_curves_dleq = { package = "pasta_curves", path = "vendor/pasta_curves", features = ["alloc", "zeroize"] }
rand_core = { version = "=0.6.4", features = ["getrandom"] }
sha2 = "=0.10.9"

orchard = "=0.16.0"
pasta_curves = "=0.6.1"
pczt = "=0.10.0-pre.2"
reddsa = "=0.6.1"
zcash_address = "=0.14.0-pre.2"
zcash_client_backend = { version = "=0.25.0-pre.2", features = ["pczt", "lightwalletd-tonic-transport", "sync"] }
zcash_client_sqlite = { version = "=0.23.0-pre.2", features = ["serde", "transparent-inputs"] }
zcash_keys = "=0.17.0-pre.2"
zcash_primitives = "=0.31.0-pre.2"
zcash_protocol = { version = "=0.11.0-pre.1", features = ["local-consensus"] }
rusqlite = { version = "=0.37.0", default-features = false }
tonic = { version = "=0.14.6", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[profile.dev.package."*"]
opt-level = 2
