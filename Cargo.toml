[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.93"
license = "MIT OR Apache-2.0"
publish = false

# Every external crate is pinned exactly, once, here (AGENTS.md NEVER-6, ADR-026).
# Each pin also needs a row in STACK.md.
[workspace.dependencies]
bitcoin = "=0.32.11"
blake2b_simd = "=1.0.5"
proptest = "=1.12.0"
thiserror = "=2.0.21"
zeroize = { version = "=1.9.1", features = ["derive"] }

# Zcash pre-release set for NU7 (ADR-007). These move together; bump them as one.
orchard = "=0.16.0"
pasta_curves = "=0.6.1"
pczt = "=0.10.0-pre.2"
reddsa = "=0.6.1"
zcash_address = "=0.14.0-pre.2"
zcash_client_backend = { version = "=0.25.0-pre.2", features = ["pczt", "lightwalletd-tonic-transport"] }
# Must match the backend's `transparent-inputs` cfg, which its `pczt` feature turns on.
zcash_client_sqlite = { version = "=0.23.0-pre.2", features = ["transparent-inputs"] }
zcash_keys = "=0.17.0-pre.2"
zcash_primitives = "=0.31.0-pre.2"
zcash_protocol = { version = "=0.11.0-pre.1", features = ["local-consensus"] }

# AGENTS.md NEVER-7, enforced by the compiler instead of review.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

# Crypto in debug builds is 10-50x slower (curve arithmetic, Halo2 proving). Optimize
# dependencies in dev and test builds; our own crates stay unoptimized for debugging.
[profile.dev.package."*"]
opt-level = 2
